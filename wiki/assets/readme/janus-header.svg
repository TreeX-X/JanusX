<!-- Note: Janus uses one flat-top frame; eye motion never redraws its silhouette. Prompt/Star states share a 5.2s timeline; see note://972afef3-2fc7-49de-a3ee-7e041225d28c/a162efb4-23a7-4468-95e6-7163fe7efdc0 -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="jhTitle jhDesc">
<title id="jhTitle">JanusX pixel header</title>
<desc id="jhDesc">Pixel Janus with a flat-top rectangular frame, warm shell highlights, two eyes glancing and blinking, and a small happy eye shimmy with floating hearts.</desc>
<style>
text{letter-spacing:0}
text{font-family:"Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono","PingFang SC","Hiragino Sans GB","Microsoft YaHei",monospace}
/* Janus is drawn in display pixels; only eyes and celebration marks move. */
.janus-rim,.janus-eye{fill:#1C343B}
.janus-face{fill:#EFE4C5}
.janus-edge-light{fill:#FFF4D2}
.janus-edge-shade{fill:#D4C7A5}
.janus-normal{visibility:visible;animation:janusNormal 5200ms step-end infinite}
.janus-happy{visibility:hidden;animation:janusHappy 5200ms step-end infinite}
.janus-gaze{animation:janusGaze 5200ms ease-in-out infinite}
.janus-blink{transform-box:fill-box;transform-origin:center;animation:janusBlink 5200ms linear infinite}
.janus-happy-eye{animation:janusWiggle 5200ms steps(1,end) infinite}
.janus-happy-eye-right{animation-delay:100ms}
.janus-cheer{opacity:0;animation:janusCheer 5200ms ease-in-out infinite}
.janus-heart-rise{animation:janusFloat 1400ms ease-in-out infinite}
.janus-heart-rise-late{animation-delay:-700ms}
@keyframes janusNormal{0%{visibility:visible}52%{visibility:hidden}96%,100%{visibility:visible}}
@keyframes janusHappy{0%{visibility:hidden}52%{visibility:visible}96%,100%{visibility:hidden}}
@keyframes janusGaze{0%,12%,30%,35%,49%,100%{transform:translateX(0)}18%,24%{transform:translateX(-4px)}40%,45%{transform:translateX(4px)}}
@keyframes janusBlink{0%,8%,12%,43%,47%,100%{transform:scaleY(1)}10%,45%{transform:scaleY(.14)}}
@keyframes janusWiggle{0%,54%,65%,78%,89%,100%{transform:translate(0,0)}55%,59%,79%,83%{transform:translate(1px,-1px)}57%,61%,81%,85%{transform:translate(-1px,1px)}63%,87%{transform:translate(0,-1px)}}
@keyframes janusCheer{0%,52%,100%{opacity:0}58%,90%{opacity:1}96%{opacity:0}}
@keyframes janusFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){
  #janus-mascot *{animation:none!important}
}
.loop{opacity:0;animation-duration:5200ms;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.t-tag{animation-name:tTag}.t-ask{animation-name:tAsk}.t-thanks{animation-name:tThanks}
.s-idle{animation-name:sIdle}.s-lit{animation-name:sLit}
@keyframes tTag{0%{opacity:0;transform:translateY(6px)}6%,19%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes tAsk{0%,25%{opacity:0;transform:translateY(6px)}31%,44%{opacity:1;transform:translateY(0)}50%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes tThanks{0%,50%{opacity:0;transform:translateY(6px)}56%,69%{opacity:1;transform:translateY(0)}75%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes sIdle{0%,25%{opacity:0;transform:translateY(6px)}31%,44%{opacity:1;transform:translateY(0)}50%,100%{opacity:0}}
@keyframes sLit{0%,75%{opacity:0;transform:translateY(6px)}81%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.word{fill:#1C343B}.desc{fill:#5A6B6E}.rule{stroke:#C9BFA4}
.bubble{fill:#1B2F35}.bubble-t{fill:#F1E7CB}
.star-idle{fill:#FFFFFF;stroke:#1C343B;stroke-width:2}.star-idle-t{fill:#1C343B}
.star-lit{fill:#E3B341}.star-lit-t{fill:#1F2328}
.xc2{fill:#1C343B}
@media (prefers-color-scheme:dark){
.word{fill:#F1E7CB}.desc{fill:#9AA4AD}.rule{stroke:#3A4A4F}
.bubble{stroke:#F1E7CB;stroke-width:1.5}
.star-idle{fill:none;stroke:#F1E7CB}.star-idle-t{fill:#F1E7CB}
.xc2{fill:#F1E7CB}
}
</style>
<g transform="translate(214,22)"><rect x="20" y="0" width="20" height="10" class="word"/><rect x="30" y="10" width="10" height="10" class="word"/><rect x="30" y="20" width="10" height="10" class="word"/><rect x="0" y="30" width="10" height="10" class="word"/><rect x="30" y="30" width="10" height="10" class="word"/><rect x="10" y="40" width="20" height="10" class="word"/><rect x="60" y="0" width="20" height="10" class="word"/><rect x="50" y="10" width="10" height="10" class="word"/><rect x="80" y="10" width="10" height="10" class="word"/><rect x="50" y="20" width="40" height="10" class="word"/><rect x="50" y="30" width="10" height="10" class="word"/><rect x="80" y="30" width="10" height="10" class="word"/><rect x="50" y="40" width="10" height="10" class="word"/><rect x="80" y="40" width="10" height="10" class="word"/><rect x="100" y="0" width="10" height="10" class="word"/><rect x="130" y="0" width="10" height="10" class="word"/><rect x="100" y="10" width="20" height="10" class="word"/><rect x="130" y="10" width="10" height="10" class="word"/><rect x="100" y="20" width="10" height="10" class="word"/><rect x="120" y="20" width="20" height="10" class="word"/><rect x="100" y="30" width="10" height="10" class="word"/><rect x="130" y="30" width="10" height="10" class="word"/><rect x="100" y="40" width="10" height="10" class="word"/><rect x="130" y="40" width="10" height="10" class="word"/><rect x="150" y="0" width="10" height="10" class="word"/><rect x="180" y="0" width="10" height="10" class="word"/><rect x="150" y="10" width="10" height="10" class="word"/><rect x="180" y="10" width="10" height="10" class="word"/><rect x="150" y="20" width="10" height="10" class="word"/><rect x="180" y="20" width="10" height="10" class="word"/><rect x="150" y="30" width="10" height="10" class="word"/><rect x="180" y="30" width="10" height="10" class="word"/><rect x="160" y="40" width="20" height="10" class="word"/><rect x="210" y="0" width="30" height="10" class="word"/><rect x="200" y="10" width="10" height="10" class="word"/><rect x="210" y="20" width="20" height="10" class="word"/><rect x="230" y="30" width="10" height="10" class="word"/><rect x="200" y="40" width="30" height="10" class="word"/><rect x="250" y="0" width="10" height="10" class="xc1" fill="#D43D2A"/><rect x="290" y="0" width="10" height="10" class="xc2" fill="#1C343B"/><rect x="260" y="10" width="10" height="10" class="xc1" fill="#D43D2A"/><rect x="280" y="10" width="10" height="10" class="xc2" fill="#1C343B"/><rect x="270" y="20" width="10" height="10" class="xc1" fill="#D43D2A"/><rect x="260" y="30" width="10" height="10" class="xc2" fill="#1C343B"/><rect x="280" y="30" width="10" height="10" class="xc1" fill="#D43D2A"/><rect x="250" y="40" width="10" height="10" class="xc2" fill="#1C343B"/><rect x="290" y="40" width="10" height="10" class="xc1" fill="#D43D2A"/></g>
<text class="desc" x="214" y="92" font-size="15" font-family="Cascadia Code,SFMono-Regular,Consolas,Liberation Mono,monospace">PROJECTS  TERMINALS  AI  IN ONE DESKTOP</text>
<line class="rule" x1="214" y1="103" x2="742" y2="103" stroke-width="1"/>
<g>
<rect class="bubble" x="214" y="113" width="252" height="34" rx="9"/>
<path class="bubble" d="M266 147l8 8 8-8z"/>
<text class="bubble-t loop t-tag" x="340" y="130" font-size="14" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Code,SFMono-Regular,Consolas,Liberation Mono,monospace">BUILD WITH JANUSX</text>
<text class="bubble-t loop t-ask" x="340" y="130" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Code,SFMono-Regular,Consolas,Liberation Mono,monospace">LIKE IT? GIVE US A STAR</text>
<text class="bubble-t loop t-thanks" x="340" y="130" font-size="13" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Code,SFMono-Regular,Consolas,Liberation Mono,monospace">THANKS, STAR RECEIVED</text>
</g>
<a href="https://github.com/TreeX-X/JanusX"><g>
<g class="loop s-idle"><rect class="star-idle" x="492" y="111" width="250" height="38" rx="9"/><path d="M511 117l3.6 7.3 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="none" stroke="#5A6B6E" stroke-width="1.8"/><text class="star-idle-t" x="625" y="130" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Code,SFMono-Regular,Consolas,Liberation Mono,monospace">STAR JANUSX</text></g>
<g class="loop s-lit"><rect class="star-lit" x="492" y="111" width="250" height="38" rx="9"/><path d="M511 117l3.6 7.3 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#D43D2A" stroke="#A92E20" stroke-width="1"/><text class="star-lit-t" x="625" y="130" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Cascadia Code,SFMono-Regular,Consolas,Liberation Mono,monospace">STARRED +1</text></g>
</g></a>
<g id="janus-mascot" shape-rendering="crispEdges" aria-hidden="true">
  <g id="janus-shell">
    <rect id="janus-frame" class="janus-rim" x="8" y="55" width="160" height="110"/>
    <rect class="janus-face" x="16" y="63" width="144" height="94"/>
    <path class="janus-edge-light" d="M18 65H158V67H20V153H18Z"/>
    <path class="janus-edge-shade" d="M158 67H160V157H18V155H158Z"/>
  </g>
  <g id="janus-eyes-normal" class="janus-normal">
    <g class="janus-gaze">
      <g class="janus-blink janus-eye">
        <path d="M60 94H72V96H74V120H72V122H60V120H58V96H60Z"/>
        <path d="M104 94H116V96H118V120H116V122H104V120H102V96H104Z"/>
      </g>
    </g>
  </g>
  <g id="janus-eyes-happy" class="janus-happy janus-eye">
    <g class="janus-happy-eye">
      <path d="M56 112V106H58V104H60V102H72V104H74V106H76V112H72V108H70V106H62V108H60V112Z"/>
    </g>
    <g class="janus-happy-eye janus-happy-eye-right">
      <path d="M100 112V106H102V104H104V102H116V104H118V106H120V112H116V108H114V106H106V108H104V112Z"/>
    </g>
  </g>
  <g id="janus-celebration" class="janus-cheer">
    <g transform="translate(44 26)">
      <g class="janus-heart-rise">
        <path fill="#D43D2A" d="M4 0H10V2H12V0H18V2H20V4H22V10H20V12H18V14H16V16H14V18H12V20H10V18H8V16H6V14H4V12H2V10H0V4H2V2H4Z"/>
        <path fill="#F28B75" d="M4 4H8V6H4ZM2 6H4V8H2Z"/>
      </g>
    </g>
    <g transform="translate(110 20)">
      <g class="janus-heart-rise janus-heart-rise-late">
        <path fill="#D43D2A" d="M4 0H10V2H12V0H18V2H20V4H22V10H20V12H18V14H16V16H14V18H12V20H10V18H8V16H6V14H4V12H2V10H0V4H2V2H4Z"/>
        <path fill="#F28B75" d="M4 4H8V6H4ZM2 6H4V8H2Z"/>
      </g>
    </g>
    <path fill="#E3B341" d="M32 32H34V34H36V36H34V38H32V36H30V34H32ZM146 24H148V26H150V28H148V30H146V28H144V26H146Z"/>
  </g>
</g>
</svg>
