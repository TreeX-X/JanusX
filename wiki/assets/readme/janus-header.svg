<!-- Original rounded Janus Island capsule; pixel wordmark uses JanusChat PIXEL_WORDMARK. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
<title id="title">JanusX — 胶囊与像素字标</title>
<desc id="desc">圆角双眼胶囊搭配方格像素 JANUSX 字标。星星点亮时，双眼平滑展开为电子屏条带，快速的脉冲从左向右连续扫过两次，再平滑合回矩形眼睛。装饰动画不代表实际账号的 Star 状态。</desc>
<style>
.shell{fill:#EFE4C5;stroke:#1C343B;stroke-width:3}
.ink,.word{fill:#1C343B}.paper{fill:#EFE4C5}.accent{fill:#D43D2A}
.label{fill:#1C343B;font:500 14px 'Segoe UI',Arial,sans-serif}
.hint{fill:#647579;font:13px 'Segoe UI','Microsoft YaHei',sans-serif}
.button{fill:#F8F5EB;stroke:#C8C9BA;stroke-width:1.2}
.press{transform-box:fill-box;transform-origin:center;animation:press 9s ease infinite}
.pointer{fill:#1C343B;stroke:#fff;stroke-width:1.3;stroke-linejoin:round;opacity:0;animation:pointer 9s cubic-bezier(.4,0,.2,1) infinite}
.invite{opacity:1;animation:invite 9s ease infinite}.thanks{opacity:0;animation:thanks 9s ease infinite}
.open{animation:open 9s steps(1,end) infinite}.closed{opacity:0;animation:closed 9s steps(1,end) infinite}
.smile{opacity:0;animation:smile 9s steps(1,end) infinite}
.happy-eye{transform-box:fill-box;transform-origin:center;animation:happy-pulse 9s cubic-bezier(.22,.7,.3,1) infinite,led-gap 9s ease-in-out infinite;animation-delay:var(--pulse-delay),0s}
.star{fill:transparent;stroke:#647579;stroke-width:1.7;stroke-linejoin:round;animation:star 9s ease infinite}
@keyframes open{0%,12%,17%,58%,100%{opacity:1}10%,15%,38%{opacity:0}}
@keyframes closed{0%,12%,17%,100%{opacity:0}10%,15%{opacity:1}}
@keyframes smile{0%,58%,100%{opacity:0}38%{opacity:1}}
@keyframes star{0%,34%,86%,100%{fill:transparent;stroke:#647579}38%,75%{fill:#D43D2A;stroke:#D43D2A}}
@keyframes press{0%,33%,40%,100%{transform:scale(1)}36%{transform:scale(.985)}}
@keyframes pointer{0%,18%{opacity:0;transform:translate(50px,25px)}23%{opacity:1}33%,37%{opacity:1;transform:translate(0,0)}44%{opacity:1;transform:translate(14px,10px)}51%,100%{opacity:0;transform:translate(28px,20px)}}
@keyframes invite{0%,36%,84%,100%{opacity:1}43%,76%{opacity:0}}
@keyframes thanks{0%,36%,84%,100%{opacity:0}44%,74%{opacity:1}}
@keyframes led-gap{0%,38%,58%,100%{width:var(--solid-width)}40%,55%{width:3px}}
@keyframes happy-pulse{0%,40%,41.8%,48%,49.8%,100%{transform:scaleY(1)}40.6%,48.6%{transform:scaleY(.5)}}
@media(prefers-color-scheme:dark){.word{fill:#EFE4C5}.accent{fill:#E77B65}.button{fill:#191F24;stroke:#465054}.label{fill:#E8E4D9}.hint{fill:#9BA7AC}.pointer{fill:#EFE4C5;stroke:#1C343B}}
@media(prefers-reduced-motion:reduce){.happy-eye,.open,.closed,.smile,.star,.press,.pointer,.invite,.thanks{animation:none}.closed,.smile,.pointer,.thanks{display:none}.open,.invite{opacity:1}}
</style>
