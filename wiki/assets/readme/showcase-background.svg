<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>JanusX shared presentation wallpaper</title>
  <!-- Original macOS-inspired silver, smoke-teal and champagne wallpaper.
       Medium luminance separates both charcoal and warm planche windows.
       Export once to an opaque PNG;
       every showcase frame reuses that exact image, including GIF loops. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C8286"/>
      <stop offset=".48" stop-color="#95A6A5"/>
      <stop offset="1" stop-color="#CBD0C5"/>
    </linearGradient>
    <linearGradient id="dawn" x1="1120" y1="-100" x2="1940" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6ADA4"/>
      <stop offset=".48" stop-color="#CDC5AF"/>
      <stop offset="1" stop-color="#B1B4A7"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="180" y1="860" x2="1460" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBCAC6"/>
      <stop offset=".36" stop-color="#8A9FA1"/>
      <stop offset=".75" stop-color="#71868C"/>
      <stop offset="1" stop-color="#B0B7AA"/>
    </linearGradient>
    <linearGradient id="ocean" x1="240" y1="850" x2="780" y2="1220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D5960"/>
      <stop offset=".4" stop-color="#5D7B80"/>
      <stop offset="1" stop-color="#9AB0AE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DEE7DE" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ABBAB6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <path d="M880-120H2040V900C1770 812 1670 642 1548 416 1417 173 1150 128 880-120Z" fill="url(#dawn)"/>
  <path d="M-140 1210V902C170 867 250 708 462 673 784 620 950 936 1221 899 1562 854 1589 487 2040 450V1210Z" fill="url(#ribbon)"/>
  <path d="M-140 995C175 1053 218 744 502 748 791 752 891 1072 1230 1015" fill="none" stroke="#DDE5D8" stroke-opacity=".24" stroke-width="92" filter="url(#soft)"/>
  <path d="M-120 1140V979C130 1084 230 817 427 845 618 873 732 1113 1056 1140Z" fill="url(#ocean)"/>
  <path d="M-120 979C130 1084 230 817 427 845 618 873 732 1113 1056 1140" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
