<!-- Review candidate. Geometry follows the application's 52x26 capsule and 8x10 eyes / 3px gap. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">JanusX</title>
  <desc id="desc">The Janus capsule: paper, ink, and two quietly blinking eyes.</desc>
  <style>
    .shell { fill: #EFE4C5; stroke: #1C343B; stroke-width: 3; }
    .eye, .word { fill: #1C343B; }
    .accent { fill: #D43D2A; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes blink { 0%,40%,44%,100% { transform: scaleY(1); } 42% { transform: scaleY(.12); } }
    @media (prefers-color-scheme: dark) {
      .word { fill: #EFE4C5; }
      .accent { fill: #E77B65; }
    }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
  </style>
  <g transform="translate(64 0)">
  <rect class="shell" x="123" y="51" width="156" height="78" rx="39"/>
  <g class="blink">
    <rect class="eye" x="172.5" y="75" width="24" height="30"/>
    <rect class="eye" x="205.5" y="75" width="24" height="30"/>
  </g>
  <text x="317" y="111" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="650" letter-spacing="-2" class="word">Janus<tspan class="accent">X</tspan></text>
  </g>
</svg>
