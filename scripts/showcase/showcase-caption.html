<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .chip{display:inline-flex;align-items:center;gap:12px;background:#1C343B;color:#EFE4C5;
    font-size:30px;font-weight:700;border-radius:12px;padding:10px 26px 10px 14px;margin:10px;
    border:2px solid #1C343B;box-shadow:5px 5px 0 rgba(28,52,59,.35);white-space:nowrap}
  .chip .n{width:36px;height:36px;border-radius:50%;background:#C83020;color:#fff;font-size:22px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
</style></head>
<body>
  <div class="chip" id="caption"><span class="n"></span><span class="text"></span></div>
</body></html>
