<!doctype html>
<!--
  设计假设：一只悠闲的鹈鹕沿海岸骑车，暖色绘本风格，循环播放。
  画面、样式、动画均内联；无需网络、字体下载或构建工具。
  Note: 单一时间轴保持踏板、双脚与风景同步 — see .agents/notes/implemented/feature/2026-09-19-pelican-bicycle.md
-->
<html lang="zh-CN">

  <style>
    :root {

      --accent: #c55f43;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }
    .page { width: min(1280px, 100%); margin: auto; padding: 36px 40px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    h1 {
      font-family: "Palatino Linotype", "Songti SC", "STSong", "SimSun", serif;
      font-size: clamp(28px, 3.1vw, 42px);
      font-weight: 500;
      letter-spacing: .05em;
      margin: 0 0 10px;
    }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .12em; line-height: 1.7; }
    .status { display: flex; align-items: center; gap: 9px; font-size: 12px; white-space: nowrap; color: #596a61; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #698772; }
    body[data-paused="true"] .status-dot { background: #c39162; }
    .scene {
      overflow: hidden;
      border-radius: 10px;
      background: #f2e6c8;
      aspect-ratio: 1200 / 690;
      width: 100%;
    }
    #landscape { width: 100%; height: 100%; display: block; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 23px; }
    .playback { display: flex; align-items: center; gap: 10px; }
    #play {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-width: 100px; min-height: 44px; padding: 0 19px;
      border: 0; border-radius: 24px; color: var(--paper); background: var(--ink);
      font-size: 13px;
    }
    #play:hover { background: #405d53; }
    .control-icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .play-mark { display: none; }
    body[data-paused="true"] .pause-mark { display: none; }
    body[data-paused="true"] .play-mark { display: block; }
    #restart { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #d7d9cb; border-radius: 50%; background: transparent; color: var(--ink); }
    #restart:hover { background: #eae9dc; }
    .speed { display: flex; align-items: center; gap: 15px; color: #626e63; font-size: 12px; }
    #speed { width: 128px; height: 24px; margin: 0; accent-color: var(--ink); cursor: pointer; }
    #speed-value { min-width: 32px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .hint { margin: 17px 0 0; text-align: center; font-size: 11px; color: #72796d; letter-spacing: .1em; }
    noscript { display: block; padding: 10px; font-size: 14px; }
    @media (max-width: 640px) {
      .page { padding: 28px 18px 18px; }
      header { margin-bottom: 24px; }
      .status { display: none; }
      .subtitle { font-size: 12px; letter-spacing: .08em; }
      .scene { aspect-ratio: 630 / 565; }
      .controls { gap: 12px; padding-top: 20px; }
      .speed { gap: 8px; }
      #speed { width: 83px; }
      #play { min-width: 86px; padding: 0 14px; }
      .hint { font-size: 10px; }
    }
    @media (max-width: 350px) {
      .controls { flex-wrap: wrap; }
      .speed { margin-left: auto; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const nodes = Object.fromEntries([
        'landscape', 'rider', 'rear-wheel', 'front-wheel', 'crank', 'wing', 'wing-feathers',
        'near-leg', 'near-leg-outline', 'far-leg', 'far-leg-outline', 'near-pedal', 'far-pedal',
        'clouds', 'islands', 'lighthouse', 'sailboat', 'verge', 'foreground', 'shadow',
        'eye', 'scarf-tail', 'scarf-fold', 'sea-lines', 'road-marks', 'distant-bird-a', 'distant-bird-b'
      ].map(id => [id, $(id)]));
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const narrowScreen = matchMedia('(max-width: 640px)');
      const storageKey = 'pelican-coastal-ride';
      const recordingDuration = 24;
      let time = 0;
      let speed = 1;
      let playing = !reducedMotion.matches;
      let lastTick = null;
      let frame = null;

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
        if (saved && !window.__recording) {
          if (Number.isFinite(saved.time) && saved.time >= 0) time = saved.time;
          if (Number.isFinite(saved.speed) && saved.speed >= .5 && saved.speed <= 2) speed = saved.speed;
        }
      } catch { /* Private browsing can deny local storage; playback still works. */ }

      function save() {
        try { localStorage.setItem(storageKey, JSON.stringify({ time, speed })); } catch { /* Optional persistence. */ }
      }
      function transform(id, value) { nodes[id].setAttribute('transform', value); }
      function path(id, value) { nodes[id].setAttribute('d', value); }

      // Two rigid leg segments meet at the knee. The ankle tracks its pedal.
      function leg(side, angle, bob) {
        const x = 590 + Math.cos(angle) * 32;
        const y = 550 + Math.sin(angle) * 32;
        const hipX = side === 'near' ? 563 : 550;
        const hipY = 437 + bob;
        const dx = x - hipX;
        const dy = y - 5 - hipY;
        const distance = Math.hypot(dx, dy);
        const upper = 69, lower = 85;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx * along / distance + dy * bend / distance;
        const kneeY = hipY + dy * along / distance - dx * bend / distance;
        const d = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${x} ${y - 5}`;
        path(`${side}-leg`, d);
        path(`${side}-leg-outline`, d);
        transform(`${side}-pedal`, `translate(${x} ${y - 1})`);
        return { x, y };
      }

      function render(t) {
        const phase = t * Math.PI / 1.2;
        const bob = Math.sin(phase * 2) * 1.8;
        const wheelAngle = t * 320 / 93 * 180 / Math.PI;
        transform('rear-wheel', `rotate(${wheelAngle})`);
        transform('front-wheel', `rotate(${wheelAngle})`);
        transform('rider', `translate(0 ${bob})`);
        const near = leg('near', phase, bob);
        const far = leg('far', phase + Math.PI, bob);
        path('crank', `M${far.x} ${far.y}L${near.x} ${near.y}`);

        // The shoulder bobs with the body while the wing tip holds the bars.
        path('wing', `M548 ${372 + bob}C574 ${358 + bob} 591 ${382 + bob} 613 ${393 + bob}Q652 420 709 408Q724 405 726 414Q725 425 712 426Q657 441 611 ${422 + bob}C591 ${429 + bob} 562 ${419 + bob} 544 ${400 + bob}Q534 ${384 + bob} 548 ${372 + bob}Z`);
        path('wing-feathers', `M556 ${388 + bob}Q580 ${411 + bob} 613 ${412 + bob} M560 ${397 + bob}Q578 ${418 + bob} 603 ${417 + bob} M689 419L714 416`);

        const flutter = Math.sin(t * 6) * 4;
        path('scarf-tail', `M645 326C612 ${321 + flutter} 600 ${307 - flutter} 568 ${316 + flutter}L577 ${324 + flutter}L562 ${330 + flutter}C594 ${325 - flutter} 612 ${342 + flutter} 640 339Z`);
        path('scarf-fold', `M638 332Q605 ${321 + flutter} 578 ${322 + flutter}`);
        const blinkPhase = t % 5.3;
        const eyeScale = blinkPhase > 4.9 && blinkPhase < 5.12
          ? Math.max(.08, Math.abs(blinkPhase - 5.01) / .11) : 1;
        transform('eye', `translate(695 273) scale(1 ${eyeScale})`);

        transform('clouds', `translate(${-((t * 10) % 1440)} 0)`);
        transform('islands', `translate(${-((t * 15) % 1200)} 0)`);
        transform('lighthouse', `translate(${-((t * 15 + 240) % 1560) + 240} 0)`);
        transform('sailboat', `translate(${((191 - t * 9 + 160) % 1440 + 1440) % 1440 - 160} ${458 + Math.sin(t * 1.4) * 1.2})`);
        transform('verge', `translate(${-((t * 120) % 1200)} 0)`);
        transform('foreground', `translate(${-((t * 320) % 1200)} 0)`);
        nodes['road-marks'].setAttribute('patternTransform', `translate(${-((t * 320) % 260)} 0)`);
        nodes['sea-lines'].setAttribute('patternTransform', `translate(${-((t * 19) % 220)} 0)`);
        const flap = Math.sin(t * 2) * 3;
        path('distant-bird-a', `M269 ${257 + flap}q11 ${-10 - flap} 22 0q11 ${-10 - flap} 22 0`);
        path('distant-bird-b', `M324 ${235 - flap}q8 ${-8 + flap} 16 0q8 ${-8 + flap} 16 0`);
        nodes.shadow.setAttribute('rx', 265 - bob * 1.5);
      }

      function syncControls() {
        document.body.dataset.paused = String(!playing);
        $('play-label').textContent = playing ? '暂停' : '继续';
        $('play').setAttribute('aria-label', playing ? '暂停动画' : '继续播放动画');
        $('status-text').textContent = playing ? '海边骑行中' : '停下来，吹吹风';
        $('speed').value = speed;
        $('speed').setAttribute('aria-valuetext', `${speed} 倍速度`);
        $('speed-value').value = `${speed}×`;
      }

      function schedule() {
        if (frame === null && !document.hidden) frame = requestAnimationFrame(tick);
      }
      function tick(now) {
        frame = null;
        if (lastTick === null) {
          lastTick = now;
          render(time);
          window.__ready = true;
        } else {
          const dt = Math.min((now - lastTick) / 1000, .08);
          lastTick = now;
          if (playing) {
            time += dt * speed;
            if (window.__recording && time >= recordingDuration) {
              time = recordingDuration;
              playing = false;
              syncControls();
            }
            render(time);
          }
        }
        if (playing) schedule();
      }
      function setPlaying(value) {
        playing = value;
        lastTick = null;
        syncControls();
        save();
        schedule();
      }

      $('play').addEventListener('click', () => setPlaying(!playing));
      $('restart').addEventListener('click', () => {
        time = 0;
        render(time);
        setPlaying(true);
      });
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        syncControls();
        save();
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, select, textarea, [contenteditable]')) return;
        event.preventDefault();
        setPlaying(!playing);
      });
      document.addEventListener('visibilitychange', () => {
        lastTick = null;
        if (document.hidden) {
          if (frame !== null) cancelAnimationFrame(frame);
          frame = null;
          save();
        } else if (playing) schedule();
      });
      window.addEventListener('pagehide', save);
      reducedMotion.addEventListener('change', event => {
        if (event.matches) setPlaying(false);
      });
      function resize() {
        nodes.landscape.setAttribute('viewBox', narrowScreen.matches ? '285 125 630 565' : '0 0 1200 690');
        $('sun').setAttribute('transform', narrowScreen.matches ? 'translate(-130 25)' : 'translate(0 0)');
        $('keyboard-hint').hidden = narrowScreen.matches;
      }
      narrowScreen.addEventListener('change', resize);
      // Deterministic seeking also supports frame capture without a second timer.
      window.__seek = value => {
        if (!Number.isFinite(value)) return;
        time = Math.max(0, window.__recording ? Math.min(value, recordingDuration) : value);
        lastTick = null;
        render(time);
      };
      resize();
      syncControls();
      render(time);
      document.fonts.ready.then(schedule);
    })();
  </script>
</body>
</html>
