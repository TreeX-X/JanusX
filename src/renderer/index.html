<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanusX</title>
    <style>
      /* Toast 预漆透明：透明窗口首漆前 html/body 即透明，避免 380x112 灰矩闪现 */
      html.toast-prepaint,
      html.toast-prepaint body {
        background: transparent;
      }
    </style>
    <script>
      try {
        const params = new URLSearchParams(location.search)
        // Seed the window before styles/modules load; persisted theme is
        // still read before React mounts. See standalone-editor-initial-theme Note.
        const prefix = params.has('initialTheme') ? 'initial' : 'editor'
        if (params.has(`${prefix}Theme`)) {
          document.documentElement.dataset.theme = params.get(`${prefix}Theme`)
          document.documentElement.style.backgroundColor = `var(--shell-canvas, ${params.get(`${prefix}Background`) || 'transparent'})`
          document.documentElement.style.colorScheme = params.get(`${prefix}ColorScheme`) || ''
        }
        if (params.get('desktopToast') === '1') {
          document.documentElement.classList.add('toast-prepaint')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
