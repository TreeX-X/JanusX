<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简洁测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #0056b3;
        }
        
        .btn-success {
            background-color: #28a745;
        }
        
        .btn-success:hover {
            background-color: #1e7e34;
        }
        
        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            display: none;
        }
        
        .counter {
            font-size: 48px;
            text-align: center;
            margin: 20px 0;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>简洁测试页面</h1>
    
    <div class="card">
        <h2>按钮测试</h2>
        <p>点击按钮查看效果：</p>
        <button class="btn" onclick="showAlert()">弹窗提示</button>
        <button class="btn btn-success" onclick="toggleResult()">显示/隐藏结果</button>
        <div id="result" class="result">
            这是隐藏的内容区域，点击按钮可以切换显示状态。
        </div>
    </div>
    
    <div class="card">
        <h2>计数器</h2>
        <div class="counter" id="counter">0</div>
        <button class="btn" onclick="increment()">+1</button>
        <button class="btn" onclick="decrement()">-1</button>
        <button class="btn btn-success" onclick="resetCounter()">重置</button>
    </div>
    
    <div class="card">
        <h2>时间显示</h2>
        <p>当前时间：<strong id="time"></strong></p>
        <button class="btn" onclick="updateTime()">刷新时间</button>
    </div>

    <script>
        // 计数器功能
        let count = 0;
        
        function increment() {
            count++;
            updateCounter();
        }
        
        function decrement() {
            count--;
            updateCounter();
        }
        
        function resetCounter() {
            count = 0;
            updateCounter();
        }
        
        function updateCounter() {
            document.getElementById('counter').textContent = count;
        }
        
        // 弹窗提示
        function showAlert() {
            alert('你好！这是一个简洁的测试页面。');
        }
        
        // 切换结果显示
        function toggleResult() {
            const result = document.getElementById('result');
            result.style.display = result.style.display === 'none' ? 'block' : 'none';
        }
        
        // 时间功能
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('time').textContent = timeString;
        }
        
        // 初始化时间并每秒更新
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
