plugins { id 'com.android.application' }
android {
    namespace 'com.janusx.p2plab'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.janusx.p2plab'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.5'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/terminalAssets')
}
tasks.register('buildTerminalAssets', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'node', 'scripts/android-lab/build-terminal.mjs'
    inputs.dir rootProject.file('terminal')
    inputs.file rootProject.file('../../scripts/android-lab/build-terminal.mjs')
    inputs.dir rootProject.file('../../node_modules/@xterm/xterm')
    outputs.dir layout.buildDirectory.dir('generated/terminalAssets')
}
tasks.named('preBuild').configure { dependsOn 'buildTerminalAssets' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'io.github.webrtc-sdk:android:144.7559.15'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
