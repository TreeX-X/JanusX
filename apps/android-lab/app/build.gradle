plugins { id 'com.android.application' }
def remoteDefaults = new groovy.json.JsonSlurper().parse(rootProject.file('../../src/shared/remote-defaults.json'))
def remoteScope = providers.gradleProperty('remoteScope').getOrElse('lan')
if (!(remoteScope in ['lan', 'develop'])) throw new GradleException('remoteScope must be lan or develop')
def lanOnly = remoteScope == 'lan'
android {
    namespace 'com.janusx.p2plab'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId lanOnly ? 'com.janusx.p2plab.lan' : 'com.janusx.p2plab'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName lanOnly ? '0.1.13-lan' : '0.1.13-dev'
        buildConfigField 'boolean', 'LAN_ONLY', lanOnly.toString()
        buildConfigField 'String', 'DEFAULT_SIGNAL_URL', groovy.json.JsonOutput.toJson(lanOnly ? '' : remoteDefaults.signalUrl)
        buildConfigField 'String', 'DEFAULT_STUN_URL', groovy.json.JsonOutput.toJson(lanOnly ? '' : remoteDefaults.stunUrl)
        resValue 'string', 'app_name', lanOnly ? 'JanusX LAN Test' : 'JanusX P2P Develop'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/terminalAssets')
}
tasks.register('buildTerminalAssets', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'node', 'scripts/android-lab/build-terminal.mjs'
    inputs.dir rootProject.file('terminal')
    inputs.file rootProject.file('../../scripts/android-lab/build-terminal.mjs')
    inputs.dir rootProject.file('../../node_modules/@xterm/xterm')
    outputs.dir layout.buildDirectory.dir('generated/terminalAssets')
}
tasks.named('preBuild').configure { dependsOn 'buildTerminalAssets' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'io.github.webrtc-sdk:android:144.7559.15'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
