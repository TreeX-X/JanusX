<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重新生成的HTML示例</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            min-height: 100vh;
        }
        h1 {
            color: #1565c0;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        p {
            color: #424242;
            line-height: 1.8;
            font-size: 16px;
        }
        .feature-box {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 25px 0;
            border-left: 5px solid #2196f3;
        }
        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto;
        }
        .btn:hover {
            background-color: #388e3c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <h1>🎨 重新生成的HTML示例</h1>
    <p>这是一个全新生成的HTML页面，展示了更现代的设计风格和交互效果。</p>
    
    <div class="feature-box">
        <h3>✨ 新特点：</h3>
        <ul>
            <li>渐变背景设计</li>
            <li>卡片式布局</li>
            <li>更丰富的交互效果</li>
            <li>现代化的按钮样式</li>
        </ul>
    </div>
    
    <button class="btn" onclick="showNewAlert()">✨ 点击体验新交互</button>
    
    <script>
        function showNewAlert() {
            // 创建临时元素显示消息
            const msg = document.createElement('div');
            msg.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0,0,0,0.9);
                color: white;
                padding: 30px 50px;
                border-radius: 15px;
                font-size: 18px;
                z-index: 1000;
                text-align: center;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            `;
            msg.innerHTML = '🎉 恭喜！<br>你体验了重新生成的HTML！';
            document.body.appendChild(msg);
            
            setTimeout(() => {
                msg.style.opacity = '0';
                msg.style.transition = 'opacity 0.5s ease';
                setTimeout(() => msg.remove(), 500);
            }, 2000);
        }
    </script>
</body>
</html>
